<!DOCTYPE html>
<html>
<head>
  <title>Advanced 3D Hall Effect Lab</title>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <style>
    /* Modern Glassmorphism UI Panel */
    body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    #ui-panel {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 320px;
      background: rgba(20, 20, 25, 0.85);
      backdrop-filter: blur(10px);
      padding: 20px;
      border-radius: 15px;
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      z-index: 9999;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      max-height: 90vh;
      overflow-y: auto;
    }
    h2 { margin-top: 0; font-size: 18px; border-bottom: 1px solid #444; padding-bottom: 10px; text-align: center; }
    .control-group { margin-bottom: 15px; }
    .control-group label { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 5px; color: #ccc;}
    input[type="range"] { width: 100%; accent-color: #00d2ff; cursor: pointer; }
    .radio-group { display: flex; gap: 15px; margin-top: 5px; }
    .radio-group label { font-size: 14px; cursor: pointer; color: #fff; display: inline-flex; align-items: center; gap: 5px;}
    
    /* Digital Readout */
    #readout {
      background: #000;
      color: #0f0;
      font-family: 'Courier New', Courier, monospace;
      padding: 10px;
      text-align: center;
      font-size: 20px;
      border-radius: 8px;
      margin-top: 15px;
      border: 2px solid #333;
    }

    /* Observation Table CSS */
    #obs-table-container {
      margin-top: 15px;
      max-height: 150px;
      overflow-y: auto;
      border-top: 1px solid rgba(255,255,255,0.2);
      padding-top: 10px;
    }
    table { width: 100%; border-collapse: collapse; font-size: 12px; text-align: center; }
    th, td { border: 1px solid rgba(255,255,255,0.3); padding: 4px; }
    th { background: rgba(0, 210, 255, 0.2); color: #00d2ff; position: sticky; top: 0;}
    .btn { 
      width: 100%; padding: 8px; margin-top: 10px; border: none; border-radius: 5px; 
      background: #00d2ff; color: #000; font-weight: bold; cursor: pointer;
    }
    .btn:hover { background: #00b8e6; }
  </style>
</head>
<body>

  <!-- 2D Interactive UI Panel -->
  <div id="ui-panel">
    <h2>Hall Effect Setup Control</h2>
    
    <div class="control-group">
      <label>Semiconductor Type:</label>
      <div class="radio-group">
        <label><input type="radio" name="semi-type" value="n" checked> N-Type</label>
        <label><input type="radio" name="semi-type" value="p"> P-Type</label>
      </div>
    </div>

    <div class="control-group">
      <label>Current (I): <span id="val-i">5 mA</span></label>
      <input type="range" id="slider-i" min="1" max="20" step="0.5" value="5">
    </div>

    <div class="control-group">
      <label>Magnetic Field (B): <span id="val-b">0.5 T</span></label>
      <input type="range" id="slider-b" min="0" max="2" step="0.1" value="0.5">
    </div>

    <div class="control-group">
      <label>Temperature (T): <span id="val-t">300 K</span></label>
      <input type="range" id="slider-t" min="300" max="500" step="10" value="300">
    </div>

    <div id="readout">
      Vh: <span id="vh-display">0.00</span> mV
    </div>

    <!-- Observation Table Area -->
    <button class="btn" id="record-btn">Record Reading</button>
    
    <div id="obs-table-container">
      <table id="obs-table">
        <tr>
          <th>T (K)</th>
          <th>I (mA)</th>
          <th>B (T)</th>
          <th>Vh (mV)</th>
        </tr>
        <!-- Data rows yahan inject hongi -->
      </table>
    </div>
  </div>

  <!-- 3D Environment (A-Frame) -->
  <a-scene shadow="type: pcfsoft">
    <a-assets>
      <img id="wood" src="https://cdn.aframe.io/a-painter/images/floor.jpg" crossorigin="anonymous">
    </a-assets>

    <!-- Lighting -->
    <a-light type="ambient" color="#555"></a-light>
    <a-light type="directional" position="2 4 3" cast-shadow="true" intensity="1.2"></a-light>
    <a-light type="point" position="0 2 -3" intensity="0.5" color="#00d2ff"></a-light>

    <!-- Room / Sky -->
    <a-sky color="#1a1a24"></a-sky>

    <!-- Lab Table -->
    <a-box position="0 0 -3" width="5" height="0.2" depth="3" material="src: #wood; roughness: 0.8" shadow="receive: true"></a-box>

    <!-- Electromagnets (North & South) -->
    <a-cylinder position="-0.7 0.4 -3" radius="0.2" height="0.6" color="#cc0000" shadow="cast: true"></a-cylinder>
    <a-text value="N" position="-0.7 0.8 -3" align="center" color="white"></a-text>
    
    <a-cylinder position="0.7 0.4 -3" radius="0.2" height="0.6" color="#0000cc" shadow="cast: true"></a-cylinder>
    <a-text value="S" position="0.7 0.8 -3" align="center" color="white"></a-text>

    <!-- Heating Oven -->
    <a-cylinder id="heater-visual" position="0 0.4 -3" radius="0.3" height="0.4" 
                color="#222" opacity="0.3" transparent="true" shadow="cast: false"></a-cylinder>

    <!-- Semiconductor Sample -->
    <a-box id="sample-visual" position="0 0.4 -3" width="0.4" height="0.02" depth="0.2" color="#555" shadow="cast: true"></a-box>

    <!-- Floating 3D Text Display -->
    <a-text id="vh-3d-text" value="Vh: 0.00 mV" position="0 1.2 -3" align="center" width="4" color="#00FF00"></a-text>

    <!-- Camera -->
    <a-entity position="0 1.5 0">
      <a-camera look-controls wasd-controls>
        <a-cursor color="#fff"></a-cursor>
      </a-camera>
    </a-entity>
  </a-scene>

  <!-- Physics & Interactivity Logic -->
  <script>
    // Physics Constants
    const e = 1.6e-19; // Electron charge
    const d = 0.001;   // Thickness (m)
    let base_n = 1e21; // Base carrier density at 300K

    // UI Elements
    const sliderI = document.getElementById('slider-i');
    const sliderB = document.getElementById('slider-b');
    const sliderT = document.getElementById('slider-t');
    const radiosType = document.getElementsByName('semi-type');
    
    const valI = document.getElementById('val-i');
    const valB = document.getElementById('val-b');
    const valT = document.getElementById('val-t');
    const vhDisplay = document.getElementById('vh-display');
    
    // 3D Elements
    const vh3DText = document.getElementById('vh-3d-text');
    const heaterVisual = document.getElementById('heater-visual');
    const sampleVisual = document.getElementById('sample-visual');

    // Table Elements
    const recordBtn = document.getElementById('record-btn');
    const obsTable = document.getElementById('obs-table');

    function updateSimulation() {
      let I_mA = parseFloat(sliderI.value);
      let B_T = parseFloat(sliderB.value);
      let T_K = parseFloat(sliderT.value);
      
      let isPType = document.querySelector('input[name="semi-type"]:checked').value === 'p';
      let sign = isPType ? 1 : -1;

      valI.innerText = I_mA.toFixed(1) + ' mA';
      valB.innerText = B_T.toFixed(2) + ' T';
      valT.innerText = T_K + ' K';

      let tempFactor = 1 + Math.pow((T_K - 300) / 50, 2); 
      let n_current = base_n * tempFactor;

      let I_A = I_mA * 1e-3; 
      let Vh_Volts = sign * (I_A * B_T) / (n_current * e * d);
      let Vh_mV = Vh_Volts * 1000; 

      vhDisplay.innerText = Vh_mV.toFixed(3);
      if(isPType) {
          vhDisplay.style.color = "#00ff00"; 
          sampleVisual.setAttribute('color', '#8b5a2b'); 
      } else {
          vhDisplay.style.color = "#ff3333"; 
          sampleVisual.setAttribute('color', '#4a708b'); 
      }

      vh3DText.setAttribute('value', `Vh: ${Vh_mV.toFixed(3)} mV`);
      vh3DText.setAttribute('color', isPType ? '#00FF00' : '#FF3333');

      let heatIntensity = (T_K - 300) / 200; 
      let r = 34 + (heatIntensity * 221); 
      let g = 34 - (heatIntensity * 34);  
      let b = 34 - (heatIntensity * 34);  
      heaterVisual.setAttribute('color', `rgb(${Math.floor(r)}, ${Math.floor(g)}, ${Math.floor(b)})`);
      heaterVisual.setAttribute('opacity', 0.3 + (heatIntensity * 0.5));
    }

    // Record Reading to Table
    recordBtn.addEventListener('click', () => {
      let I_mA = parseFloat(sliderI.value).toFixed(1);
      let B_T = parseFloat(sliderB.value).toFixed(2);
      let T_K = sliderT.value;
      let Vh_mV = vhDisplay.innerText;

      let newRow = obsTable.insertRow();
      newRow.innerHTML = `
        <td>${T_K}</td>
        <td>${I_mA}</td>
        <td>${B_T}</td>
        <td style="color:${vhDisplay.style.color}">${Vh_mV}</td>
      `;
    });

    // Event Listeners
    sliderI.addEventListener('input', updateSimulation);
    sliderB.addEventListener('input', updateSimulation);
    sliderT.addEventListener('input', updateSimulation);
    Array.from(radiosType).forEach(radio => radio.addEventListener('change', updateSimulation));

    // Initialize
    updateSimulation();
  </script>
</body>
</html>
